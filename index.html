<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#40382f;
    --amber:#f2a444;
    --amber-soft:rgba(242,164,68,.55);
    --amber-faint:rgba(242,164,68,.16);
    --cream:#f3d9b0;
    --cream-hi:#ffe6c2;
    --ink:#40382f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    background-image:
      repeating-linear-gradient(0deg,transparent 0 31px,rgba(242,164,68,.05) 31px 32px),
      repeating-linear-gradient(90deg,transparent 0 31px,rgba(242,164,68,.05) 31px 32px);
    font-family:'Golos Text',system-ui,sans-serif;
    color:var(--amber);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:rgba(242,164,68,.28);color:#fff}
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-thumb{background:rgba(242,164,68,.3);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  :focus-visible{outline:2px solid var(--cream-hi);outline-offset:3px}

  /* ---------- grain ---------- */
  .grain{
    position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.06;mix-blend-mode:overlay;
  }

  /* ---------- decor ---------- */
  .decor{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .glow{position:absolute;top:-18%;left:50%;transform:translateX(-50%);width:min(1100px,120vw);height:620px;
    background:radial-gradient(60% 60% at 50% 40%,rgba(242,164,68,.16),transparent 70%)}
  .cross{position:absolute;width:16px;height:16px;opacity:.5}
  .cross::before,.cross::after{content:'';position:absolute;background:var(--amber)}
  .cross::before{top:7px;left:0;width:16px;height:1.5px}
  .cross::after{left:7px;top:0;width:1.5px;height:16px}
  .tag{position:absolute;font:500 10px 'JetBrains Mono',monospace;letter-spacing:1px;color:rgba(242,164,68,.4)}
  .ghostwin{position:absolute;border:1.5px solid rgba(242,164,68,.16);border-radius:4px}
  .ghostwin .bar{height:20px;border-bottom:1px solid rgba(242,164,68,.16);display:flex;align-items:center;gap:5px;padding:0 8px}
  .ghostwin .bar i{width:6px;height:6px;border-radius:50%;border:1px solid rgba(242,164,68,.3);display:block}
  .rule{position:absolute;top:14%;bottom:14%;width:1px;
    background:repeating-linear-gradient(180deg,rgba(242,164,68,.22) 0 5px,transparent 5px 12px)}
  .mark{position:absolute;font-family:'JetBrains Mono',monospace;font-weight:300;color:rgba(242,164,68,.22)}
  .warp{position:absolute;opacity:.18}
  .spinner{position:absolute;font:300 190px 'JetBrains Mono',monospace;color:rgba(242,164,68,.06);line-height:1;
    animation:spin 60s linear infinite}
  @media (max-width:900px){.decor .desktop-only{display:none}}

  /* ---------- layout ---------- */
  header{position:relative;z-index:3;max-width:1100px;margin:0 auto;display:flex;align-items:center;
    justify-content:space-between;padding:clamp(18px,3vw,30px) clamp(20px,4vw,48px)}
  .brand{font:700 clamp(11px,1.4vw,13px) 'JetBrains Mono',monospace;letter-spacing:1.5px;color:rgba(242,164,68,.8)}
  .lang{border:1.5px solid var(--amber);background:transparent;color:var(--amber);
    font:700 12px 'JetBrains Mono',monospace;padding:6px 13px;border-radius:2px;cursor:pointer;transition:.15s}
  .lang:hover{background:var(--amber);color:var(--ink)}

  main{position:relative;z-index:3;max-width:580px;margin:0 auto;
    padding:clamp(6px,2vw,20px) clamp(20px,4vw,32px) 90px;display:flex;flex-direction:column}

  /* ---------- windows ---------- */
  .win{border:1.5px solid var(--amber);background:rgba(0,0,0,.16);border-radius:4px;
    box-shadow:5px 5px 0 rgba(242,164,68,.14);position:relative}
  .win .bar{display:flex;align-items:center;gap:9px;padding:9px 12px;
    border-bottom:1px solid rgba(242,164,68,.4);font:700 11px 'JetBrains Mono',monospace}
  .win .bar i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--amber);display:block;flex:none}
  .win .bar .name{flex:1;text-align:center;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .win .body{padding:clamp(20px,3vw,30px) clamp(20px,3vw,28px)}

  /* tilt + overlap — the "desk", not the "form" */
  .w-hello{align-self:flex-start;width:100%;transform:rotate(-1.1deg);animation:fadeUp .6s both}
  .w-you{align-self:flex-end;width:96%;transform:rotate(.9deg);margin-top:-14px;
    box-shadow:5px 5px 0 rgba(242,164,68,.12);animation:fadeUp .5s both;z-index:2}
  .w-reply{align-self:flex-start;width:100%;transform:rotate(-.6deg);margin-top:-10px;
    animation:fadeUp .6s both;z-index:3}
  @media (max-width:520px){
    .w-hello,.w-you,.w-reply{transform:none;width:100%;margin-top:0}
  }

  p{margin:0 0 12px;font:500 clamp(15px,1.9vw,17px)/1.55 'Golos Text';color:var(--cream)}
  p:last-child{margin-bottom:0}

  .clock{font:500 12px 'JetBrains Mono',monospace;letter-spacing:.5px;color:rgba(242,164,68,.62);
    margin:0 0 16px;display:block}
  .cta-line{margin:clamp(18px,2.4vw,26px) 0 0;font:800 clamp(30px,5.6vw,48px)/1.02 'Golos Text';
    letter-spacing:-1.5px;
    background:linear-gradient(90deg,#f2a444 0%,#ffe6c2 45%,#ff9a6b 70%,#f2a444 95%);
    background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;color:transparent;animation:shimmer 5s linear infinite}

  .btn-row{display:flex;justify-content:flex-end;margin:18px 0 0;position:relative;z-index:4}
  .btn-davai{border:2px solid var(--amber);background:transparent;color:var(--amber);
    font:700 clamp(15px,1.9vw,18px) 'Golos Text';padding:12px 30px;border-radius:3px;cursor:pointer;
    box-shadow:4px 4px 0 rgba(242,164,68,.35);transition:.15s}
  .btn-davai:hover{background:var(--amber);color:var(--ink);transform:translate(-1px,-1px)}

  /* ---------- role picker ---------- */
  .lead{font:600 clamp(17px,2.3vw,21px)/1.45 'Golos Text';color:var(--cream)}
  .role-toggle{border:0;background:transparent;color:var(--amber);
    font:700 clamp(17px,2.3vw,21px) 'Golos Text';padding:0;cursor:pointer;
    text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
  .role-list{display:flex;flex-direction:column;gap:8px;margin-top:15px}
  .role-opt{text-align:left;border:1px solid var(--amber-soft);background:transparent;color:var(--amber);
    font:600 clamp(14px,1.8vw,16px) 'Golos Text';padding:10px 14px;border-radius:2px;cursor:pointer;transition:.14s}
  .role-opt:hover{background:var(--amber);color:var(--ink)}
  .btn-send{display:flex;align-items:center;gap:9px;border:2px solid var(--amber);background:var(--amber);
    color:var(--ink);font:700 clamp(14px,1.8vw,16px) 'Golos Text';padding:10px 20px;border-radius:3px;
    cursor:pointer;box-shadow:4px 4px 0 rgba(242,164,68,.3);transition:.15s}
  .btn-send:hover{background:#ffd9a0;transform:translate(-1px,-1px)}

  /* ---------- typing (with glitch dupe) ---------- */
  .typing-wrap{align-self:flex-start;position:relative;margin-top:20px;animation:fadeUp .4s both}
  .typing{display:flex;align-items:center;gap:8px;border:1.5px solid var(--amber-soft);
    background:rgba(0,0,0,.16);border-radius:4px;padding:12px 16px;position:relative;z-index:2}
  .typing-ghost{position:absolute;inset:0;transform:translate(4px,4px);border:1.5px solid rgba(242,164,68,.2);
    border-radius:4px;z-index:1}
  .typing span{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}

  /* ---------- reply: the loud moment ---------- */
  .kicker{font:500 10px 'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;
    color:rgba(242,164,68,.55);margin:0 0 14px}
  .hero-fact{margin:0 0 14px;font:900 clamp(30px,6vw,46px)/.96 'Golos Text';letter-spacing:-2px;
    color:var(--amber);text-wrap:balance}
  .hero-sub{margin:0 0 18px;font:600 clamp(15px,1.9vw,17px)/1.5 'Golos Text';color:var(--cream-hi)}
  .support{margin:0 0 24px;padding-left:14px;border-left:2px solid var(--amber-faint);
    font:400 clamp(13px,1.6vw,14.5px)/1.6 'Golos Text';color:rgba(243,217,176,.72)}
  .actions{display:flex;flex-direction:column;gap:11px}
  .act{text-decoration:none;text-align:center;font:700 clamp(14px,1.8vw,16px) 'Golos Text';
    padding:13px;border-radius:3px;transition:.14s;display:block}
  .act-primary{border:2px solid var(--amber);background:var(--amber);color:var(--ink);
    box-shadow:4px 4px 0 rgba(242,164,68,.3)}
  .act-primary:hover{background:#ffd9a0;transform:translate(-1px,-1px)}
  .act-ghost{border:1.5px solid var(--amber-soft);background:transparent;color:var(--amber)}
  .act-ghost:hover{background:rgba(242,164,68,.12)}
  .footnote{margin-top:22px;font:500 11px 'JetBrains Mono',monospace;letter-spacing:.5px;
    color:rgba(242,164,68,.45);text-align:center}
  .footnote a{color:rgba(242,164,68,.75)}

  .hidden{display:none}

  /* ---------- motion ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px) rotate(var(--rot,0deg))}}
  @keyframes shimmer{to{background-position:200% 0}}
  @keyframes blink{0%,80%,100%{opacity:.22}40%{opacity:1}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .cta-line{-webkit-text-fill-color:var(--amber);color:var(--amber);background:none}
  }
</style>
</head>

<script>
/* ============================================================
   ONE PLACE TO EDIT — links, timezone
   ============================================================ */
const LINKS = {
  cv:       "Kaim2026.pdf",                    // ← положи PDF рядом с index.html
  telegram: "https://t.me/welcomeitsdk",
  email:    "mailto:dmitrii.kaim@gmail.com",
  linkedin: "https://www.linkedin.com/in/dmitrii-kaim-470258161",
  notion:   "https://notion.so/8c72481078ec463bbc189d9b501f4a22"
};
const MY_TZ   = "Europe/Moscow";   // ← твой реальный пояс. Алматы → "Asia/Almaty"
const MY_CITY = { ru:"Санкт-Петербурге", en:"Saint Petersburg" };

/* ============================================================
   ROLES — three audiences, three different answers
   ============================================================ */
const ROLES = [
  {
    id:"hr",
    ru:{ nom:"HR-менеджер",
         kicker:"Быстрая версия",
         fact:"Вывел 3 продукта на рынок за год",
         sub:"NGFW, Container Platform, GPT-решения. Занимался полным циклом продуктового маркетинга для рынка Казахстана",
         support:"7 лет в маркетинге, 2 из них в продуктовом. B2B/SaaS, облако, кибербез. Английский B2, готов к релокации.",
         acts:[["cv","Смотреть CV","primary"],["telegram","Написать в Telegram","ghost"]] },
    en:{ nom:"an HR manager",
         kicker:"The short version",
         fact:"3 products launched in one year",
         sub:"NGFW, Container Platform, GPT tool. Positioning through to MQL. Kazakhstan market.",
         support:"7 years in marketing, 2 in product marketing. B2B/SaaS, cloud, cybersecurity. English B2, open to relocation.",
         acts:[["cv","View CV","primary"],["telegram","Message on Telegram","ghost"]] }
  },
  {
    id:"lead",
    ru:{ nom:"CMO",
         kicker:"Запуск системного маркетинга",
         fact:"Работа в тесной связке с продажами",
         sub:"Например, 8 клиентских B2B-мероприятий в Алматы и Астане. Каждое закрывалось в квалифицированные сделки.",
         support:"ABM через Clay: нашел 100+ целевых контактов в pre-sale. Партнёрская программа с нуля: 14 партнёров, новый канал продаж. Пересмотр цен на SSL с потенциалом +25% к прибыли.",
         acts:[["telegram","Обсудить продукт","primary"],["cv","Смотреть CV","ghost"]] },
    en:{ nom:"CMO/ Business owner",
         kicker:"Not reach but revenue",
         fact:"30% of event guests converted to SQL",
         sub:"8 client B2B events in Almaty and Astana. Every one of them closed into qualified deals.",
         support:"ABM via Clay: 100+ target contacts into pre-sale. Partner program from zero: 14 partners, a new sales channel. SSL repricing — 25% profit upside.",
         acts:[["telegram","Talk about your product","primary"],["cv","View CV","ghost"]] }
  },
  {
    id:"owner",
    ru:{ nom:"собственник бизнеса",
         kicker:"Маркетинг = выручка",
         fact:"+25% к прибыли на цене",
         sub:"Разобрал рынок SSL-сертификатов, нашёл потенциал, пересмотрел ценообразование, выручка по продукту выросла.",
         support:"Моя специализация - сложные B2B-tech продукты: GTM, позиционирование, CustDev, JTBD. Работал с крупными брендами и стартапами",
         acts:[["telegram","Написать в Telegram","primary"],["cv","Смотреть CV","ghost"]] },
    en:{ nom:"a business owner",

         support:"I specialise in complex B2B tech: GTM, positioning, CustDev, JTBD. The method travels: 7 years across MTS Bank, VSMPO-AVISMA, IT integrators, retail.",
         acts:[["telegram","Message on Telegram","primary"],["cv","View CV","ghost"]] }

const COPY = {
  ru:{ g1:"Привет. Меня зовут Дмитрий, я продуктовый маркетолог.",
       g2:"Вывожу сложные B2B-продукты на рынок: облако, кибербез, инфраструктура.",
       cta:"Давай познакомимся?", davai:"Давай!", lead:"Привет, я ", send:"отправить",
       foot:'Или сразу: <a href="'+LINKS.email+'">почта</a> · <a href="'+LINKS.linkedin+'" target="_blank" rel="noopener">LinkedIn</a>',
       other:"EN" },
  en:{ g1:"Hi. My name is Dmitry, I'm a product marketer.",
       g2:"I take complex B2B products to market: cloud, cybersecurity, infrastructure.",
       cta:"Let's get to know each other?", davai:"Let's do it!", lead:"Hi, I'm ", send:"send",
       foot:'Or just: <a href="'+LINKS.email+'">email</a> · <a href="'+LINKS.linkedin+'" target="_blank" rel="noopener">LinkedIn</a>',
       other:"RU" }
};

/* ---------- state ---------- */
let lang = "ru", role = 0, open = false, step = 0, typing = false;
const $ = id => document.getElementById(id);

/* ---------- honest clock: their time vs my time ---------- */
function offsetHours(tz, d){
  const s = new Intl.DateTimeFormat("en-US",{timeZone:tz,hour12:false,
    year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).formatToParts(d);
  const g = t => +s.find(p=>p.type===t).value;
  return (Date.UTC(g("year"),g("month")-1,g("day"),g("hour")%24,g("minute"),g("second")) - d.getTime())/3600000;
}
function plural(n,a,b,c){
  const x = Math.abs(n)%100, y = x%10;
  if(x>10 && x<20) return c;
  if(y>1 && y<5)   return b;
  if(y===1)        return a;
  return c;
}
function renderClock(){
  const d = new Date();
  const youTz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const fmt = tz => new Intl.DateTimeFormat(lang==="ru"?"ru-RU":"en-US",
    {hour:"2-digit",minute:"2-digit",hour12:lang!=="ru",timeZone:tz}).format(d);
  const diff = Math.round(offsetHours(MY_TZ,d) - offsetHours(youTz,d));
  const you = fmt(youTz), me = fmt(MY_TZ);

  if(lang === "ru"){
    const tail = diff === 0
      ? "Отличный график!"
      : `Разница — ${Math.abs(diff)} ${plural(Math.abs(diff),"час","часа","часов")}. Пересечёмся?`;
    $("clock").textContent = `У тебя ${you} · У меня ${me} в ${MY_CITY.ru}. ${tail}`;
  } else {
    const tail = diff === 0
      ? "Same timezone — we can talk any time."
      : `${Math.abs(diff)} ${Math.abs(diff)===1?"hour":"hours"} apart. Easy to find a slot.`;
    $("clock").textContent = `It's ${you} for you · ${me} for me in ${MY_CITY.en}. ${tail}`;
  }
}

/* ---------- render ---------- */
function render(){
  const t = COPY[lang], r = ROLES[role][lang];

  renderClock();
  $("lang").textContent = t.other;
  $("g1").textContent = t.g1;
  $("g2").textContent = t.g2;
  $("cta").textContent = t.cta;
  $("davai").textContent = t.davai;
  $("lead").textContent = t.lead;
  $("roleToggle").textContent = r.nom;
  $("sendLabel").textContent = t.send;

  $("youWin").classList.toggle("hidden", step < 1);
  $("sendRow").classList.toggle("hidden", step < 1);
  $("typingWrap").classList.toggle("hidden", !typing);
  $("replyWin").classList.toggle("hidden", step < 2);
  $("roleList").classList.toggle("hidden", !open);

  // role options (only the ones you're not)
  $("roleList").innerHTML = "";
  ROLES.forEach((rr,i) => {
    if(i === role) return;
    const b = document.createElement("button");
    b.className = "role-opt";
    b.textContent = rr[lang].nom;
    b.onclick = () => { role = i; open = false; render(); };
    $("roleList").appendChild(b);
  });

  if(step >= 2){
    $("kicker").textContent  = r.kicker;
    $("fact").textContent    = r.fact;
    $("factSub").textContent = r.sub;
    $("support").textContent = r.support;
    $("footnote").innerHTML  = t.foot;
    $("actions").innerHTML   = "";
    r.acts.forEach(([key,label,kind]) => {
      const a = document.createElement("a");
      a.className = "act " + (kind === "primary" ? "act-primary" : "act-ghost");
      a.href = LINKS[key];
      a.textContent = label;
      if(key !== "cv"){ a.target = "_blank"; a.rel = "noopener"; }
      $("actions").appendChild(a);
    });
  }
}

/* ---------- events ---------- */
$("lang").onclick = () => { lang = lang === "ru" ? "en" : "ru"; render(); };
$("davai").onclick = () => { step = Math.max(step,1); render();
  $("youWin").scrollIntoView({behavior:"smooth",block:"center"}); };
$("roleToggle").onclick = () => { open = !open; render(); };
$("send").onclick = () => {
  open = false; typing = true; render();
  setTimeout(() => { typing = false; step = 2; render();
    $("replyWin").scrollIntoView({behavior:"smooth",block:"center"}); }, 1300);
};

/* ---------- cursor parallax (desktop, motion-safe) ---------- */
const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if(!calm && window.matchMedia("(min-width:900px)").matches){
  const layers = document.querySelectorAll("[data-depth]");
  window.addEventListener("mousemove", e => {
    const x = (e.clientX / innerWidth  - .5);
    const y = (e.clientY / innerHeight - .5);
    layers.forEach(l => {
      const d = +l.dataset.depth;
      l.style.translate = `${-x*d}px ${-y*d}px`;
    });
  });
}

render();
setInterval(renderClock, 30000);
</script>
</body>
</html>
